name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled, but every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # No "cache: gradle" here: setup-gradle handles caching and the two conflict.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # The same checks CLAUDE.md requires before a change is done.
      - run: ./gradlew spotlessCheck lint testDebugUnitTest :lint-rules:test assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 14
